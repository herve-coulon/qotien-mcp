# Smithery configuration for a REMOTE, self-hosted MCP server.
#
# ⚠️ Verify the current schema at https://smithery.ai/docs — Smithery's config format
# has evolved, and for a server you ALREADY host (as here) the most reliable path is often
# their web UI: "Add Server" → paste the remote URL below. This file is the declarative
# equivalent; adjust field names to match Smithery's current schema if needed.

# This MCP is not built or deployed by Smithery — it is a remote Streamable HTTP endpoint
# that we host. Smithery only needs to connect to it.
startCommand:
  type: http
  # The hosted MCP endpoint (JSON-RPC 2.0 over HTTP POST; GET serves a keepalive SSE stream).
  url: https://app.qotien.fr/api/fiscal/v1/mcp

# No stored secret/API key — the endpoint is paid per call via x402 (USDC on Base), settled
# at call time; two discovery tools are free. Nothing to configure in Smithery.
configSchema:
  type: object
  properties: {}
  additionalProperties: false
